<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InkFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* --- Global Reset & Solid Dark Theme --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #262626;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sleek Scrollbars */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }

        /* --- Top-Left Brand Header --- */
        .brand-header {
            position: fixed;
            top: clamp(16px, 4.4vh, 48px);
            left: clamp(20px, 3.2vw, 56px);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1001;
            box-sizing: border-box;
        }

        .logo-box {
            width: clamp(46px, 3.8vw, 56px);
            height: clamp(46px, 3.8vw, 56px);
            background-color: #ffffff;
            border-radius: 13px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .app-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.25);
        }

        .brand-title {
            font-family: 'Caveat', cursive;
            font-size: clamp(1.85rem, 2.2vw, 2.2rem);
            color: #ffffff;
            margin: 0;
            letter-spacing: 2.5px;
            font-weight: 600;
            line-height: 1;
        }

        /* --- Left Control Container --- */
        .left-panel {
            position: fixed;
            top: clamp(88px, 15.8vh, 180px);
            left: clamp(32px, 9.4vw, 150px);
            width: clamp(315px, 28vw, 410px);
            height: clamp(440px, 63.3vh, 640px);
            max-height: calc(100dvh - 110px);
            z-index: 1000;
            box-sizing: border-box;
        }

        .control-box {
            width: 100%;
            height: 100%;
            background-color: #333333;
            border: 1.5px solid #4a4a4a;
            border-radius: 16px;
            padding: clamp(26px, 4.8vh, 46px) clamp(24px, 2.5vw, 38px) clamp(24px, 3.8vh, 38px);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            box-shadow: 0 18px 80px 22px rgba(0, 0, 0, 0.72), 0 6px 24px rgba(0, 0, 0, 0.5);
        }

        /* Control Groups */
        .control-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .group-pen { margin-bottom: clamp(14px, 2.2vh, 24px); }
        .group-font { margin-bottom: clamp(16px, 2.8vh, 28px); }
        .group-size { margin-bottom: clamp(16px, 2.5vh, 26px); }
        .group-align { margin-bottom: 16px; }

        .control-group label.group-title {
            font-size: 0.92rem;
            color: #c8c8c8;
            font-weight: 400;
            letter-spacing: 0.6px;
            margin-bottom: clamp(8px, 1.3vh, 14px);
        }

        /* --- Pen Color Circles --- */
        .pen-colors {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.2px solid #7c7c7c;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .color-btn:hover { transform: scale(1.05); }
        .color-btn.active {
            border: 2px solid #dcdcdc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }

        .btn-blue-color { background-color: #2614b8; }
        .btn-black-color { background-color: #050505; }
        .btn-red-color { background-color: #b30b08; }

        /* --- Custom Font Upload Pill Box --- */
        .custom-file-box {
            background-color: #545454;
            border: 1px solid #666666;
            border-radius: 12px;
            padding: 9px 11px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
        }

        .upload-btn-label {
            background-color: #d8d8d8;
            color: #0d0d0d;
            font-size: 0.9rem;
            font-weight: 400;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
            user-select: none;
        }
        .upload-btn-label:hover { background-color: #eaeaea; }

        .file-name-text {
            color: #f0f0f0;
            font-size: 0.88rem;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Custom Dual-Thickness Teal Sliders & 20PX Badge --- */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 92%;
            box-sizing: border-box;
        }

        .custom-slider-container {
            position: relative;
            flex: 1;
            height: 22px;
            display: flex;
            align-items: center;
        }

        .slider-track-bg {
            position: absolute;
            left: 0;
            right: 0;
            height: 3.5px;
            background-color: #dcdcdc;
            border-radius: 4px;
            pointer-events: none;
        }

        .slider-track-fill {
            position: absolute;
            left: 0;
            height: 8px;
            width: 65%;
            background-color: #489ba7;
            border-radius: 10px;
            pointer-events: none;
        }

        .slider-thumb-visual {
            position: absolute;
            width: 17px;
            height: 17px;
            background-color: #489ba7;
            border-radius: 50%;
            left: 65%;
            transform: translateX(-50%);
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
        }

        .real-range-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            margin: 0;
            z-index: 5;
        }

        .slider-value {
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 400;
            letter-spacing: 0.4px;
            background-color: #545454;
            border: 1px solid #777777;
            padding: 7px 7px;
            border-radius: 8px;
            min-width: 38px;
            text-align: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        /* --- Centered Export Button at Bottom of Container --- */
        .export-section {
            margin-top: auto;
            padding-top: 14px;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
        }

        .export-btn-main {
            background-color: #d4d4d4;
            color: #050505;
            border: none;
            width: 185px;
            height: 44px;
            font-size: 0.95rem;
            font-weight: 400;
            border-radius: 9px;
            cursor: pointer;
            letter-spacing: 0.3px;
            white-space: pre;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
        }

        .export-btn-main:hover {
            background-color: #e6e6e6;
            transform: translateY(-1px);
        }

        .export-dropdown-content {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            width: 210px;
            background: #262626;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            box-sizing: border-box;
        }

        .export-dropdown:hover .export-dropdown-content,
        .export-dropdown.show-menu .export-dropdown-content {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .export-dropdown-item {
            background: transparent;
            color: #e5e5e5;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .export-dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .export-dropdown-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px 6px;
        }

        .export-dropdown-row {
            display: flex;
            gap: 6px;
            align-items: center;
            width: 100%;
            padding: 0 2px;
            box-sizing: border-box;
        }

        .export-dropdown-row input[type="number"] {
            width: 46px;
            padding: 7px 4px;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 6px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        /* --- Right Column: A4 Paper Workspace --- */
        .workspace {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 44vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(20px, 7.2vh, 80px) clamp(20px, 5vw, 90px) clamp(20px, 7.2vh, 80px) 2vw;
            overflow-y: auto;
            overflow-x: hidden;
            gap: 32px;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        .paper-wrapper {
            width: calc(794px * var(--paper-scale, 1));
            height: calc(1123px * var(--paper-scale, 1));
            position: relative;
            flex-shrink: 0;
            margin: 0 auto;
        }

        /* =========================================================
           EXACT REALISTIC A4 NOTEBOOK PAGE
           ========================================================= */
        .a4-paper,
        .a4-paper * {
            box-sizing: content-box;
        }

        .a4-paper {
            width: 794px;
            height: 1123px;
            background-color: #ffffff;
            background-image: linear-gradient(to bottom, transparent 26px, #aebad1 26px, #aebad1 28px);
            background-size: 100% 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(var(--paper-scale, 1));
            transform-origin: top left;
            display: flex;
            color: #172061;
            font-size: 24px;
            cursor: text;
            overflow: hidden;
            flex-shrink: 0;
            border-radius: 2px;
        }

        .top-mask {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 118px;
            background-color: #ffffff;
            z-index: 0;
        }

        .vertical-margin {
            position: absolute;
            left: 120px;
            top: 0;
            bottom: 0;
            width: 3px;
            border-left: 2px solid #c15077;
            border-right: 2px solid #c15077;
            z-index: 1;
        }

        .horizontal-margin {
            position: absolute;
            top: 105px;
            left: 0;
            right: 0;
            height: 3px;
            border-top: 2px solid #c15077;
            border-bottom: 2px solid #c15077;
            z-index: 1;
        }

        .page-box {
            position: absolute;
            top: 25px;
            right: 50px;
            width: 165px;
            border: 2px solid #c15077;
            border-radius: 8px;
            z-index: 2;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            cursor: default;
        }

        .page-box .row {
            height: 28px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: #c15077;
            letter-spacing: 0.5px;
        }

        .page-box .row.border-bottom {
            border-bottom: 2px solid #c15077;
        }

        .col-left {
            width: 120px;
            padding-left: 4px;
            padding-right: 2px;
            box-sizing: border-box !important;
            padding-top: 120px;
            z-index: 2;
            cursor: text;
        }

        .col-right {
            flex: 1;
            padding-left: 10px;
            padding-right: 4px;
            padding-top: 120px;
            z-index: 2;
            cursor: text;
        }

        .editable-area {
            min-height: 28px;
            max-height: 980px;
            outline: none;
            line-height: 28px;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
            z-index: 2;
            -webkit-font-smoothing: antialiased;
            transform: translateY(-2px);
        }

        /* =========================================================
           MOBILE & TABLET: SCROLL DOWN TO SHOW CONTAINER (NO MENU)
           ========================================================= */
        @media (max-width: 980px) {
            body {
                height: auto;
                min-height: 100dvh;
                overflow-y: auto;
                overflow-x: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px 16px 50px 16px;
                gap: 28px;
            }

            .brand-header {
                position: static;
                align-self: flex-start;
                order: 1;
                margin-left: 4px;
            }

            .workspace {
                position: static;
                order: 2;
                width: 100%;
                height: auto;
                padding: 0;
                overflow: visible;
                gap: 24px;
            }

            .left-panel {
                position: static;
                order: 3;
                width: 100%;
                max-width: 370px;
                height: auto;
                max-height: none;
                margin: 8px auto 0 auto;
            }

            .control-box {
                min-height: 480px;
                height: auto;
                padding: 34px 28px 32px 28px;
            }
        }

        /* Print formatting */
        @media print {
            body { background: none; overflow: visible; display: block; padding: 0; }
            .brand-header, .left-panel { display: none !important; }
            .workspace { position: static; padding: 0; gap: 0; display: block; overflow: visible; }
            .paper-wrapper { width: auto; height: auto; display: block; margin: 0; }
            .a4-paper { box-shadow: none; border: none; margin: 0; width: 210mm; height: 297mm; page-break-after: always; transform: none !important; position: static !important; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <!-- Top Brand Header -->
    <div class="brand-header">
        <div class="logo-box">
            <img src="https://i.pinimg.com/1200x/62/37/13/623713e807f093cc3dc0bd0e95bdf2d4.jpg" alt="InkFlow Logo" class="app-logo">
        </div>
        <h1 class="brand-title">INKFLOW</h1>
    </div>

    <!-- Control Container (Left on Desktop, Below Paper When Scrolling Down on Mobile) -->
    <div class="left-panel" id="sidebar">
        <div class="control-box">
            <!-- Pen Color -->
            <div class="control-group group-pen">
                <label class="group-title">Pen Color</label>
                <div class="pen-colors">
                    <div class="color-btn btn-blue-color active" id="btn-blue" onmousedown="changeColor('#172061', this, event)" title="Blue (Alt+1)"></div>
                    <div class="color-btn btn-black-color" id="btn-black" onmousedown="changeColor('#222222', this, event)" title="Black (Alt+2)"></div>
                    <div class="color-btn btn-red-color" id="btn-red" onmousedown="changeColor('#b01b1b', this, event)" title="Red (Alt+3)"></div>
                </div>
            </div>

            <!-- Custom Font -->
            <div class="control-group group-font">
                <label class="group-title">Custom Font</label>
                <div class="custom-file-box">
                    <label for="fontUpload" class="upload-btn-label">upload font</label>
                    <span class="file-name-text" id="fileNameDisplay">No file chosen</span>
                    <input type="file" id="fontUpload" accept=".ttf, .otf, .woff" style="display: none;">
                </div>
            </div>

            <!-- Font Size -->
            <div class="control-group group-size">
                <label class="group-title">Font Size</label>
                <div class="slider-row">
                    <div class="custom-slider-container">
                        <div class="slider-track-bg"></div>
                        <div class="slider-track-fill" id="fontSizeFill"></div>
                        <div class="slider-thumb-visual" id="fontSizeThumb"></div>
                        <input type="range" id="fontSize" class="real-range-input" min="18" max="45" value="20" title="Font Size">
                    </div>
                    <span class="slider-value" id="fontSizeVal">20PX</span>
                </div>
            </div>

            <!-- Vertical Alignment -->
            <div class="control-group group-align">
                <label class="group-title">Vertical Alignment</label>
                <div class="slider-row">
                    <div class="custom-slider-container">
                        <div class="slider-track-bg"></div>
                        <div class="slider-track-fill" id="yOffsetFill"></div>
                        <div class="slider-thumb-visual" id="yOffsetThumb"></div>
                        <input type="range" id="yOffset" class="real-range-input" min="-15" max="40" value="20" title="Vertical Alignment">
                    </div>
                    <span class="slider-value" id="yOffsetVal">20PX</span>
                </div>
            </div>

            <!-- Centered Export Page Button with Hover & Tap Menu (No Icons) -->
            <div class="export-section">
                <div class="export-dropdown" id="exportDropdown">
                    <button class="export-btn-main" id="exportMainBtn" type="button">Export  Page</button>

                    <div class="export-dropdown-content">
                        <button class="export-dropdown-item" id="btn-download-pdf" onclick="downloadAllAsPDF()">
                            Download PDF
                        </button>

                        <button class="export-dropdown-item" id="btn-download-all" onclick="downloadAllPages()">
                            Download All Pages
                        </button>

                        <div class="export-dropdown-divider"></div>

                        <div class="export-dropdown-row">
                            <input type="number" id="pageToDownload" min="1" max="1" value="1" title="Select Page Number">
                            <button class="export-dropdown-item" id="btn-download-single" onclick="downloadSinglePage()" style="flex: 1;">
                                Select Page
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- A4 Paper Workspace -->
    <div class="workspace" id="workspace">
        <div class="paper-wrapper" id="wrapper-1">
            <div class="a4-paper" id="paper-1">
                <div class="top-mask"></div>
                <div class="vertical-margin"></div>
                <div class="horizontal-margin"></div>

                <div class="page-box">
                    <div class="row border-bottom page-number-label">Page No. 1</div>
                    <div class="row">Date : &nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;/</div>
                </div>

                <div class="col-left">
                    <div class="editable-area" contenteditable="true"></div>
                </div>

                <div class="col-right">
                    <div class="editable-area" contenteditable="true"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CUSTOM DUAL-THICKNESS SLIDER LOGIC ---
        function updateCustomSlider(input, fillEl, thumbEl, valEl) {
            const min = parseFloat(input.min) || 0;
            const max = parseFloat(input.max) || 100;
            const value = parseFloat(input.value);
            const percentage = ((value - min) / (max - min)) * 100;

            fillEl.style.width = `${percentage}%`;
            thumbEl.style.left = `${percentage}%`;
            valEl.textContent = `${value}PX`;
        }

        const fontSizeInput = document.getElementById('fontSize');
        const fontSizeFill = document.getElementById('fontSizeFill');
        const fontSizeThumb = document.getElementById('fontSizeThumb');
        const fontSizeVal = document.getElementById('fontSizeVal');

        const yOffsetInput = document.getElementById('yOffset');
        const yOffsetFill = document.getElementById('yOffsetFill');
        const yOffsetThumb = document.getElementById('yOffsetThumb');
        const yOffsetVal = document.getElementById('yOffsetVal');

        updateCustomSlider(fontSizeInput, fontSizeFill, fontSizeThumb, fontSizeVal);
        updateCustomSlider(yOffsetInput, yOffsetFill, yOffsetThumb, yOffsetVal);

        fontSizeInput.addEventListener('input', function() {
            updateCustomSlider(this, fontSizeFill, fontSizeThumb, fontSizeVal);
            const size = this.value + 'px';
            document.querySelectorAll('.editable-area').forEach(el => el.style.fontSize = size);
        });

        yOffsetInput.addEventListener('input', function() {
            updateCustomSlider(this, yOffsetFill, yOffsetThumb, yOffsetVal);
            const offset = (this.value - 22) + 'px';
            document.querySelectorAll('.editable-area').forEach(el => el.style.transform = `translateY(${offset})`);
        });

        // --- RESPONSIVE UNIVERSAL SCALE FIX ---
        let lastWindowWidth = window.innerWidth;

        function adjustPaperScale(forceUpdate = false) {
            const workspace = document.getElementById('workspace');
            if (!workspace) return;

            const isMobileOrTablet = window.innerWidth <= 980;
            if (!forceUpdate && isMobileOrTablet && window.innerWidth === lastWindowWidth && document.activeElement && document.activeElement.classList.contains('editable-area')) {
                return;
            }
            lastWindowWidth = window.innerWidth;

            if (isMobileOrTablet) {
                const availableWidth = Math.max(240, document.documentElement.clientWidth - 32);
                let scale = availableWidth / 794;
                if (scale > 1) scale = 1;
                workspace.style.setProperty('--paper-scale', scale);
            } else {
                const style = window.getComputedStyle(workspace);
                const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
                const paddingY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);

                const availableWidth = Math.max(200, workspace.clientWidth - paddingX);
                const availableHeight = Math.max(250, workspace.clientHeight - paddingY);

                const scaleX = availableWidth / 794;
                const scaleY = availableHeight / 1123;

                let scale = Math.min(scaleX, scaleY);
                if (scale > 1.15) scale = 1.15;
                workspace.style.setProperty('--paper-scale', scale);
            }
        }

        window.addEventListener('resize', () => adjustPaperScale(false));
        window.addEventListener('orientationchange', () => setTimeout(() => adjustPaperScale(true), 150));
        window.addEventListener('DOMContentLoaded', () => adjustPaperScale(true));
        adjustPaperScale(true);

        // --- TOUCH & CLICK EXPORT DROPDOWN LOGIC ---
        const exportDropdown = document.getElementById('exportDropdown');
        const exportMainBtn = document.getElementById('exportMainBtn');

        exportMainBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            exportDropdown.classList.toggle('show-menu');
        });

        document.addEventListener('click', function(e) {
            if (!exportDropdown.contains(e.target)) {
                exportDropdown.classList.remove('show-menu');
            }
        });

        let pageCount = 1;
        const MAX_HEIGHT = 980;

        // Custom Font Upload & Filename Display
        document.getElementById('fontUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            if (file) {
                fileNameDisplay.textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const fontFace = new FontFace('CustomHandwriting', `url(${ev.target.result})`);
                    fontFace.load().then(function(loadedFace) {
                        document.fonts.add(loadedFace);
                        document.querySelectorAll('.editable-area').forEach(el => {
                            el.style.fontFamily = 'CustomHandwriting, sans-serif';
                        });
                    });
                };
                reader.readAsDataURL(file);
            } else {
                fileNameDisplay.textContent = 'No file chosen';
            }
        });

        // Pen Color
        function changeColor(color, btn, event) {
            if (event) event.preventDefault();
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.execCommand('styleWithCSS', false, true);
            document.execCommand('foreColor', false, color);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.altKey) {
                if (e.key === '1') changeColor('#172061', document.getElementById('btn-blue'), e);
                else if (e.key === '2') changeColor('#222222', document.getElementById('btn-black'), e);
                else if (e.key === '3') changeColor('#b01b1b', document.getElementById('btn-red'), e);
            }
            if (e.ctrlKey || e.metaKey) {
                if (e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) document.execCommand('redo');
                    else document.execCommand('undo');
                } else if (e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    document.execCommand('redo');
                }
            }
        });

        function handlePaste(e) {
            e.preventDefault();
            const text = (e.originalEvent || e).clipboardData.getData('text/plain');
            document.execCommand('insertText', false, text);
            handleOverflow(e.target);
        }

        document.querySelectorAll('.editable-area').forEach(el => el.addEventListener('paste', handlePaste));

        // Auto Pagination Logic
        document.getElementById('workspace').addEventListener('input', function(e) {
            if (e.target.classList.contains('editable-area')) {
                handleOverflow(e.target);
            }
        });

        function createNewPage() {
            pageCount++;
            document.getElementById('pageToDownload').max = pageCount;

            let wrapper = document.createElement('div');
            wrapper.className = 'paper-wrapper';
            wrapper.id = `wrapper-${pageCount}`;

            let page = document.createElement('div');
            page.className = 'a4-paper';
            page.id = `paper-${pageCount}`;
            page.innerHTML = `
                <div class="top-mask"></div>
                <div class="vertical-margin"></div>
                <div class="horizontal-margin"></div>
                <div class="page-box">
                    <div class="row border-bottom page-number-label">Page No. ${pageCount}</div>
                    <div class="row">Date : &nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;/</div>
                </div>
                <div class="col-left"><div class="editable-area" contenteditable="true"></div></div>
                <div class="col-right"><div class="editable-area" contenteditable="true"></div></div>
            `;

            let size = fontSizeInput.value + 'px';
            let offset = (yOffsetInput.value - 22) + 'px';
            let currentFont = document.querySelector('.editable-area').style.fontFamily;

            page.querySelectorAll('.editable-area').forEach(el => {
                el.style.fontSize = size;
                el.style.transform = `translateY(${offset})`;
                if (currentFont) el.style.fontFamily = currentFont;
                el.addEventListener('paste', handlePaste);
            });

            wrapper.appendChild(page);
            return wrapper;
        }

        function moveLastWordOrNode(source, target) {
            let last = source.lastChild;
            if (!last) return false;

            if (last.nodeType === Node.TEXT_NODE) {
                let text = last.textContent;
                let match = text.match(/([\s\S]*?)(\S+\s*)$/);
                if (match && match[1].length > 0) {
                    last.textContent = match[1];
                    let movedText = match[2];

                    if (target.firstChild && target.firstChild.nodeType === Node.TEXT_NODE) {
                        target.firstChild.textContent = movedText + target.firstChild.textContent;
                    } else {
                        target.insertBefore(document.createTextNode(movedText), target.firstChild);
                    }
                    return true;
                } else {
                    target.insertBefore(last, target.firstChild);
                    return true;
                }
            } else if (last.nodeType === Node.ELEMENT_NODE) {
                if (last.tagName === 'BR') {
                    target.insertBefore(last, target.firstChild);
                    return true;
                }

                if (last.childNodes.length > 0) {
                    let wrapper;
                    let targetFirst = target.firstChild;
                    if (targetFirst && targetFirst.nodeType === Node.ELEMENT_NODE && targetFirst.tagName === last.tagName && targetFirst.color === last.color) {
                        wrapper = targetFirst;
                    } else {
                        wrapper = last.cloneNode(false);
                        target.insertBefore(wrapper, target.firstChild);
                    }

                    let moved = moveLastWordOrNode(last, wrapper);
                    if (last.childNodes.length === 0) source.removeChild(last);
                    if (wrapper.childNodes.length === 0) target.removeChild(wrapper);
                    return moved;
                } else {
                    target.insertBefore(last, target.firstChild);
                    return true;
                }
            }
            target.insertBefore(last, target.firstChild);
            return true;
        }

        function handleOverflow(area) {
            if (area.scrollHeight <= MAX_HEIGHT) return;

            let paper = area.closest('.a4-paper');
            let wrapper = paper.closest('.paper-wrapper');
            let nextWrapper = wrapper.nextElementSibling;
            let nextPage = null;

            if (!nextWrapper) {
                let newWrapper = createNewPage();
                document.getElementById('workspace').appendChild(newWrapper);
                nextPage = newWrapper.querySelector('.a4-paper');
            } else {
                nextPage = nextWrapper.querySelector('.a4-paper');
            }

            let isRight = area.parentElement.classList.contains('col-right');
            let nextArea = isRight ? nextPage.querySelector('.col-right .editable-area') : nextPage.querySelector('.col-left .editable-area');
            let hadFocus = document.activeElement === area;

            let safety = 1000;
            while (area.scrollHeight > MAX_HEIGHT && safety > 0) {
                let moved = moveLastWordOrNode(area, nextArea);
                if (!moved) break;
                safety--;
            }

            if (hadFocus) {
                let range = document.createRange();
                range.selectNodeContents(nextArea);
                range.collapse(false);
                let sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                nextArea.focus();
            }

            if (nextArea.scrollHeight > MAX_HEIGHT) {
                handleOverflow(nextArea);
            }
        }

        // Click Anywhere on Page to Write
        document.getElementById('workspace').addEventListener('click', function(e) {
            if (e.target.closest('.editable-area')) return;

            let textArea = null;
            if (e.target.closest('.col-left')) {
                textArea = e.target.closest('.col-left').querySelector('.editable-area');
            } else if (e.target.closest('.col-right')) {
                textArea = e.target.closest('.col-right').querySelector('.editable-area');
            }

            if (textArea) {
                const rect = textArea.getBoundingClientRect();
                const clickY = e.clientY - rect.bottom;

                if (clickY > 0) {
                    const scale = parseFloat(getComputedStyle(document.getElementById('workspace')).getPropertyValue('--paper-scale')) || 1;
                    const scaledLineHeight = 28 * scale;
                    const linesToAdd = Math.ceil(clickY / scaledLineHeight);

                    for (let i = 0; i < linesToAdd; i++) {
                        let div = document.createElement('div');
                        div.appendChild(document.createElement('br'));
                        textArea.appendChild(div);
                    }
                    handleOverflow(textArea);
                }

                textArea.focus();

                if (typeof window.getSelection !== "undefined" && typeof document.createRange !== "undefined") {
                    const range = document.createRange();
                    range.selectNodeContents(textArea);
                    range.collapse(false);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }
        });

        // --- EXPORT HELPERS ---
        async function prepareForExport() {
            const workspace = document.getElementById('workspace');
            const originalScale = workspace.style.getPropertyValue('--paper-scale');
            workspace.style.setProperty('--paper-scale', '1');
            await new Promise(r => setTimeout(r, 150));
            return originalScale;
        }

        function restoreAfterExport(originalScale) {
            const workspace = document.getElementById('workspace');
            if (originalScale) {
                workspace.style.setProperty('--paper-scale', originalScale);
            } else {
                workspace.style.removeProperty('--paper-scale');
            }
        }

        async function exportPageToImage(pageElement) {
            const originalShadow = pageElement.style.boxShadow;
            const originalRadius = pageElement.style.borderRadius;
            pageElement.style.boxShadow = 'none';
            pageElement.style.borderRadius = '0px';

            const canvas = await html2canvas(pageElement, {
                scale: 2,
                backgroundColor: '#ffffff',
                width: 794,
                height: 1123,
                windowWidth: Math.max(window.innerWidth, 1200),
                windowHeight: Math.max(window.innerHeight, 2000),
                scrollX: 0,
                scrollY: 0
            });

            pageElement.style.boxShadow = originalShadow;
            pageElement.style.borderRadius = originalRadius;
            return canvas.toDataURL('image/png');
        }

        async function downloadAllAsPDF() {
            const btn = document.getElementById('btn-download-pdf');
            const originalText = btn.innerHTML;
            btn.innerText = "Generating PDF...";
            btn.disabled = true;

            const originalScale = await prepareForExport();

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const pages = document.querySelectorAll('.a4-paper');

                for (let i = 0; i < pages.length; i++) {
                    if (i > 0) pdf.addPage();
                    const imgData = await exportPageToImage(pages[i]);
                    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                }

                pdf.save('InkFlow_Document.pdf');
            } catch (error) {
                console.error("PDF Generation Error:", error);
                alert("Failed to generate PDF. Check console for details.");
            }

            restoreAfterExport(originalScale);
            btn.innerHTML = originalText;
            btn.disabled = false;
            exportDropdown.classList.remove('show-menu');
        }

        async function downloadAllPages() {
            const btn = document.getElementById('btn-download-all');
            const originalText = btn.innerHTML;
            btn.disabled = true;

            const pages = document.querySelectorAll('.a4-paper');
            if (pages.length > 1) {
                alert("Downloading multiple pages. Please click 'Allow' if your browser prompts you!");
            }

            const originalScale = await prepareForExport();

            for (let i = 0; i < pages.length; i++) {
                btn.innerText = `Saving ${i + 1}/${pages.length}...`;
                const imgData = await exportPageToImage(pages[i]);
                const link = document.createElement('a');
                link.download = `InkFlow_Page_${i + 1}.png`;
                link.href = imgData;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                await new Promise(r => setTimeout(r, 800));
            }

            restoreAfterExport(originalScale);
            btn.innerHTML = originalText;
            btn.disabled = false;
            exportDropdown.classList.remove('show-menu');
        }

        async function downloadSinglePage() {
            const pageNum = parseInt(document.getElementById('pageToDownload').value);
            const pageElement = document.getElementById(`paper-${pageNum}`);

            if (!pageElement) {
                alert(`Page ${pageNum} does not exist yet!`);
                return;
            }

            const btn = document.getElementById('btn-download-single');
            const originalText = btn.innerHTML;
            btn.innerText = "Wait...";
            btn.disabled = true;

            const originalScale = await prepareForExport();

            const imgData = await exportPageToImage(pageElement);
            const link = document.createElement('a');
            link.download = `InkFlow_Page_${pageNum}.png`;
            link.href = imgData;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            restoreAfterExport(originalScale);
            btn.innerHTML = originalText;
            btn.disabled = false;
            exportDropdown.classList.remove('show-menu');
        }
    </script>
</body>
